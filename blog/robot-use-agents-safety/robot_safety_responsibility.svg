<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1910" version="1.1" viewBox="0 0 940 1910" width="940" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1910" width="940" x="0" y="0" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="470" y="53">Who Ensures Safe Robotic Execution?</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="470" y="80">From explicit planning to learned policies and agentic orchestration</text><rect fill="#ffffff" height="490" rx="17" ry="17" stroke="#dfe3e8" stroke-width="1.6" width="810" x="65" y="108" /><rect fill="#eff5ff" height="43" rx="9" ry="9" stroke="#eff5ff" stroke-width="1" width="43" x="86" y="127" /><text fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="107.5" y="155">01</text><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="146" y="148">Conventional Robotics</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="146" y="169">Explicit motion planning and safety constraints</text><rect fill="#ffffff" height="28" rx="18" ry="18" stroke="#9cbbfa" stroke-width="1" width="144" x="710" y="131" /><text fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="782.0" y="150">Planner-centric</text><rect fill="#f5f6f8" height="54" rx="10" ry="10" stroke="#dfe3e8" stroke-width="1.15" width="464" x="238" y="190" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470.0" y="213">Task Planner</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="470.0" y="233">Task goal / target pose</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="488" y="259">Goal pose</text><line stroke="#8f98a5" stroke-width="1.8" x1="470" x2="470" y1="249" y2="272" /><path d="M 465,266 L 470,274 L 475,266" fill="none" stroke="#8f98a5" stroke-width="1.8" /><rect fill="#eff5ff" height="54" rx="10" ry="10" stroke="#9cbbfa" stroke-width="1.15" width="464" x="238" y="282" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470.0" y="305">IK + Motion Planner</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="470.0" y="325">MoveIt · OMPL · RRT</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="488" y="352">Candidate trajectory</text><line stroke="#8f98a5" stroke-width="1.8" x1="470" x2="470" y1="342" y2="365" /><path d="M 465,359 L 470,367 L 475,359" fill="none" stroke="#8f98a5" stroke-width="1.8" /><rect fill="#eff5ff" height="61" rx="10" ry="10" stroke="#9cbbfa" stroke-width="2.4" width="464" x="238" y="375" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="470.0" y="398">Collision Checking + Constraints</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="470.0" y="418">Robot geometry · Environment geometry</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="488" y="454">Validated trajectory</text><line stroke="#8f98a5" stroke-width="1.8" x1="470" x2="470" y1="444" y2="467" /><path d="M 465,461 L 470,469 L 475,461" fill="none" stroke="#8f98a5" stroke-width="1.8" /><rect fill="#f5f6f8" height="54" rx="10" ry="10" stroke="#dfe3e8" stroke-width="1.15" width="464" x="238" y="479" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470.0" y="512.0">Controller + Robot</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="470" y="557">↺  State and environment feedback</text><text fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="470" y="584">Safety primarily enforced through explicit planning and control</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="470" y="628">↓  More motion-generation capability learned by models</text><rect fill="#ffffff" height="508" rx="17" ry="17" stroke="#dfe3e8" stroke-width="1.6" width="810" x="65" y="658" /><rect fill="#fff6eb" height="43" rx="9" ry="9" stroke="#fff6eb" stroke-width="1" width="43" x="86" y="677" /><text fill="#b96a1e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="107.5" y="705">02</text><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="146" y="698">VLA-Based Robotics</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="146" y="719">Learned action policies</text><rect fill="#ffffff" height="28" rx="18" ry="18" stroke="#efc59a" stroke-width="1" width="144" x="710" y="681" /><text fill="#b96a1e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="782.0" y="700">Policy-centric</text><rect fill="#f5f6f8" height="54" rx="10" ry="10" stroke="#dfe3e8" stroke-width="1.15" width="464" x="238" y="740" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470.0" y="773.0">Instruction + Observation + Robot State</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="488" y="812">Visual and language inputs</text><line stroke="#8f98a5" stroke-width="1.8" x1="470" x2="470" y1="802" y2="825" /><path d="M 465,819 L 470,827 L 475,819" fill="none" stroke="#8f98a5" stroke-width="1.8" /><rect fill="#fff6eb" height="108" rx="10" ry="10" stroke="#efc59a" stroke-width="2.4" width="464" x="238" y="836" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="470" y="867">VLA Model</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="470" y="892">Perception → Action prediction</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="470" y="914">Some motion behavior learned implicitly</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="488" y="962">Action / Action chunk</text><line stroke="#8f98a5" stroke-width="1.8" x1="470" x2="470" y1="952" y2="975" /><path d="M 465,969 L 470,977 L 475,969" fill="none" stroke="#8f98a5" stroke-width="1.8" /><rect fill="#f5f6f8" height="54" rx="10" ry="10" stroke="#dfe3e8" stroke-width="1.15" width="464" x="238" y="985" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470.0" y="1018.0">Action Adapter + Controller</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="488" y="1054">Control commands</text><line stroke="#8f98a5" stroke-width="1.8" x1="470" x2="470" y1="1044" y2="1067" /><path d="M 465,1061 L 470,1069 L 475,1061" fill="none" stroke="#8f98a5" stroke-width="1.8" /><rect fill="#f5f6f8" height="45" rx="10" ry="10" stroke="#dfe3e8" stroke-width="1.15" width="464" x="238" y="1077" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470.0" y="1105.5">Robot</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="470" y="1141">↺  Updated observations → Repeated inference</text><text fill="#b96a1e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="470" y="1160">Safety partly learned; explicit safeguards may still be added</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="470" y="1195">↓  Agent can coordinate different motion-generation pathways</text><rect fill="#ffffff" height="574" rx="17" ry="17" stroke="#dfe3e8" stroke-width="1.6" width="810" x="65" y="1224" /><rect fill="#f5f0ff" height="43" rx="9" ry="9" stroke="#f5f0ff" stroke-width="1" width="43" x="86" y="1243" /><text fill="#7650c8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="107.5" y="1271">03</text><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="146" y="1264">Robot-Use Agents (RUA)</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="146" y="1285">Agentic decision-making with configurable execution pathways</text><rect fill="#ffffff" height="28" rx="18" ry="18" stroke="#c9b7f0" stroke-width="1" width="200" x="654" y="1247" /><text fill="#7650c8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="754.0" y="1266">Agent + Tool dependent</text><rect fill="#f5f6f8" height="46" rx="10" ry="10" stroke="#dfe3e8" stroke-width="1.15" width="464" x="238" y="1301" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470.0" y="1330.0">Task + Observation + Robot State</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="488" y="1364">Context / Feedback</text><line stroke="#8f98a5" stroke-width="1.8" x1="470" x2="470" y1="1354" y2="1377" /><path d="M 465,1371 L 470,1379 L 475,1371" fill="none" stroke="#8f98a5" stroke-width="1.8" /><rect fill="#f5f0ff" height="83" rx="10" ry="10" stroke="#c9b7f0" stroke-width="2.4" width="464" x="238" y="1387" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="470" y="1419">LLM / VLM Agent</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="470" y="1446">Task reasoning · Motion decisions · Tool selection</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="488" y="1489">Actions / Tool calls</text><line stroke="#8f98a5" stroke-width="1.8" x1="470" x2="470" y1="1479" y2="1502" /><path d="M 465,1496 L 470,1504 L 475,1496" fill="none" stroke="#8f98a5" stroke-width="1.8" /><rect fill="#f5f0ff" height="80" rx="10" ry="10" stroke="#c9b7f0" stroke-width="1.4" width="148" x="238" y="1511" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="312" y="1539">Direct API</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="312" y="1563">VLM-guided</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="312" y="1579">incremental motion</text><rect fill="#f5f0ff" height="80" rx="10" ry="10" stroke="#c9b7f0" stroke-width="1.4" width="148" x="396" y="1511" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470" y="1539">MoveIt</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="470" y="1563">Explicit motion</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="470" y="1579">planning</text><rect fill="#f5f0ff" height="80" rx="10" ry="10" stroke="#c9b7f0" stroke-width="1.4" width="148" x="554" y="1511" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="628" y="1539">VLA Skill</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="628" y="1563">Learned action</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="628" y="1579">policy</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="488" y="1610">Commands / Trajectories</text><line stroke="#8f98a5" stroke-width="1.8" x1="470" x2="470" y1="1600" y2="1623" /><path d="M 465,1617 L 470,1625 L 475,1617" fill="none" stroke="#8f98a5" stroke-width="1.8" /><rect fill="#f5f6f8" height="46" rx="10" ry="10" stroke="#dfe3e8" stroke-width="1.15" width="464" x="238" y="1634" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470.0" y="1663.0">Controller + Configured Safety Guards</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="488" y="1697">Physical commands</text><line stroke="#8f98a5" stroke-width="1.8" x1="470" x2="470" y1="1687" y2="1710" /><path d="M 465,1704 L 470,1712 L 475,1704" fill="none" stroke="#8f98a5" stroke-width="1.8" /><rect fill="#f5f6f8" height="40" rx="10" ry="10" stroke="#dfe3e8" stroke-width="1.15" width="464" x="238" y="1721" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470.0" y="1747.0">Robot</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="470" y="1779">↺  Perception and execution results → Agent</text><rect fill="#f5f6f8" height="74" rx="13" ry="13" stroke="#dfe3e8" stroke-width="1" width="810" x="65" y="1820" /><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" x="83" y="1843">Key distinction:</text><text fill="#20242b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="205" y="1843">Explicit planning → learned actions → configurable orchestration</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="83" y="1865">RUA pathways are illustrative, may be combined, and do not automatically ensure safety.</text><text fill="#6f7884" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="83" y="1883">The actual safety boundary depends on the tool and controller implementation.</text></svg>